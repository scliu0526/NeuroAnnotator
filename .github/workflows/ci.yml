name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild Neurocle.sln -t:Restore -p:Configuration=Release -p:Platform=x64
      - name: Build
        run: msbuild Neurocle.sln -m -p:Configuration=Release -p:Platform=x64
      - name: Test
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vstest = & $vsWhere -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vstest)) {
            throw 'VSTest console was not found on the GitHub Actions runner.'
          }
          & $vstest tests\Neurocle.Tests\bin\x64\Release\Neurocle.Tests.dll /Platform:x64 /TestCaseFilter:"TestCategory!=ManualPerformance"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path src\Neurocle.WinForms\bin\x64\Release\* -DestinationPath artifacts\Neurocle-win-x64.zip -Force
      - name: Verify package contents
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'neurocle-package'
          Expand-Archive -Path artifacts\Neurocle-win-x64.zip -DestinationPath $packageDirectory -Force
          @(
            'Neurocle.WinForms.exe',
            'Microsoft.Data.Sqlite.dll',
            'SQLitePCLRaw.batteries_v2.dll',
            'SQLitePCLRaw.core.dll',
            'SQLitePCLRaw.provider.dynamic_cdecl.dll',
            'e_sqlite3.dll',
            'THIRD-PARTY-NOTICES.md'
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $packageDirectory $_))) {
              throw "Missing packaged runtime dependency: $_"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Neurocle-win-x64
          path: artifacts\Neurocle-win-x64.zip
